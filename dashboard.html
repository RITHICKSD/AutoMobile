<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD | AUTOCORE Tactical</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body class="dashboard-body">
    <!-- Sidebar Navigation -->
    <aside class="dashboard-sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <a href="index.html"><i class="fas fa-shield-halved"></i> AUTO<span>CORE</span></a>
            </div>
            <button class="mobile-close"><i class="fas fa-times"></i></button>
        </div>

        <nav class="sidebar-nav">
            <ul>
                <li class="active" data-view="overview">
                    <a href="javascript:void(0)"><i class="fas fa-th-large"></i> <span>Command Center</span></a>
                </li>
                <li data-view="performance">
                    <a href="javascript:void(0)"><i class="fas fa-chart-line"></i> <span>Performance</span></a>
                </li>
                <li data-view="vitals">
                    <a href="javascript:void(0)"><i class="fas fa-heartbeat"></i> <span>Vitals Monitor</span></a>
                </li>
                <li data-view="missions">
                    <a href="javascript:void(0)"><i class="fas fa-route"></i> <span>Mission Log</span></a>
                </li>
                <li data-view="analytics">
                    <a href="javascript:void(0)"><i class="fas fa-microchip"></i> <span>Analytics Hub</span></a>
                </li>
                <li data-view="security">
                    <a href="javascript:void(0)"><i class="fas fa-user-shield"></i> <span>Security Uplink</span></a>
                </li>
                <li data-view="maintenance">
                    <a href="javascript:void(0)"><i class="fas fa-tools"></i> <span>Maintenance</span></a>
                </li>
                <li class="logout-item">
                    <a href="index.html"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
                </li>
            </ul>
        </nav>

        <div class="sidebar-footer" style="justify-content: center; gap: 1.5rem;">
            <button id="dashboard-theme-toggle" class="globe-toggle" title="Toggle Light/Dark Mode">
                <i class="fas fa-moon"></i>
            </button>
            <button id="dashboard-rtl-toggle" class="globe-toggle" title="Toggle LTR/RTL">
                <i class="fas fa-globe"></i>
            </button>
        </div>
    </aside>

    <!-- Main Content Viewport -->
    <main class="dashboard-main">
        <header class="dashboard-header">
            <div class="header-left">
                <button class="menu-toggle"><i class="fas fa-bars"></i></button>
                <h2 id="current-view-title">Command Center</h2>
            </div>
            <div class="header-right">
                <div class="system-status">
                    <span class="status-dot"></span>
                    <span class="status-text">SYSTEMS ONLINE</span>
                </div>
                <button class="icon-btn"><i class="fas fa-bell"></i><span class="count">3</span></button>
                <button class="icon-btn"><i class="fas fa-cog"></i></button>
            </div>
        </header>

        <div id="dashboard-content" class="content-viewport">
            <!-- Dynamic content loaded via dashboard.js -->
        </div>
    </main>

    <!-- Required Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="dashboard.js"></script>
</body>

</html>
