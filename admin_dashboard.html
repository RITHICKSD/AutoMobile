<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN DASHBOARD | AUTOCORE Tactical</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body class="dashboard-body">
    <!-- Sidebar Navigation -->
    <aside class="dashboard-sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <a href="index.html">AUTO<span>CORE</span></a>
            </div>
            <button class="mobile-close"><i class="fas fa-times"></i></button>
        </div>

        <nav class="sidebar-nav">
            <ul>
                <li class="active" data-view="fleet">
                    <a href="javascript:void(0)"><i class="fas fa-truck-monster"></i> <span>Fleet Control</span></a>
                </li>
                <li data-view="revenue">
                    <a href="javascript:void(0)"><i class="fas fa-hand-holding-usd"></i> <span>Financial
                            Intel</span></a>
                </li>
                <li data-view="users">
                    <a href="javascript:void(0)"><i class="fas fa-users-cog"></i> <span>Command Personnel</span></a>
                </li>
                <li data-view="systems">
                    <a href="javascript:void(0)"><i class="fas fa-server"></i> <span>System Integrity</span></a>
                </li>
                <li data-view="logistics">
                    <a href="javascript:void(0)"><i class="fas fa-globe-americas"></i> <span>Logistical
                            Network</span></a>
                </li>
                <li data-view="incidents">
                    <a href="javascript:void(0)"><i class="fas fa-exclamation-triangle"></i> <span>Tactical
                            Alerts</span></a>
                </li>
                <li data-view="resources">
                    <a href="javascript:void(0)"><i class="fas fa-boxes"></i> <span>Resource Planning</span></a>
                </li>
                <li class="logout-item">
                    <a href="index.html"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
                </li>
            </ul>
        </nav>

        <div class="sidebar-footer" style="justify-content: center;">
            <button id="dashboard-rtl-toggle" class="globe-toggle" title="Toggle LTR/RTL">
                <i class="fas fa-globe"></i>
            </button>
        </div>
    </aside>

    <!-- Main Content Viewport -->
    <main class="dashboard-main">
        <header class="dashboard-header">
            <div class="header-left">
                <button class="menu-toggle"><i class="fas fa-bars"></i></button>
                <h2 id="current-view-title">Fleet Control</h2>
            </div>
            <div class="header-right">
                <div class="system-status">
                    <span class="status-dot"></span>
                    <span class="status-text">FLEET MONITORING ACTIVE</span>
                </div>
                <button class="icon-btn"><i class="fas fa-bell"></i><span class="count">12</span></button>
                <button class="icon-btn"><i class="fas fa-cog"></i></button>
            </div>
        </header>

        <div id="dashboard-content" class="content-viewport">
            <!-- Dynamic content loaded via admin_dashboard.js -->
        </div>
    </main>

    <!-- Required Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="admin_dashboard.js"></script>
</body>

</html>
