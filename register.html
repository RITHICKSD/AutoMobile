<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTER | AUTOCORE Service Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body class="auth-page">
    <div class="auth-bg"></div>

    <!-- Icons placed at top-right of page, outside the card -->
    <div class="auth-header-tools">
        <button id="auth-theme-toggle" class="globe-toggle" title="Toggle Light/Dark Mode">
            <i class="fas fa-moon"></i>
        </button>
        <button id="rtl-toggle" class="globe-toggle" title="Toggle LTR/RTL">
            <span>LTR</span>
        </button>
    </div>

    <div class="auth-card reveal">
        <div class="auth-brand">
            <div class="logo" style="justify-content: center; margin-bottom: 0.75rem;">
                <a href="index.html" style="text-decoration: none; color: inherit;"><i class="fas fa-shield-halved"></i> AUTO<span>CORE</span></a>
            </div>
            <p>Create your account</p>
        </div>

        <form class="auth-form" action="dashboard.html">
            <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" placeholder="Your full name" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="your@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <div class="input-wrapper">
                    <i class="fas fa-phone"></i>
                    <input type="tel" placeholder="+1 (555) 000-0000" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Create a password" required>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-shield-alt"></i>
                    <input type="password" placeholder="Confirm your password" required>
                </div>
            </div>

            <label class="legal-check">
                <input type="checkbox" required>
                <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
            </label>

            <button type="submit" class="auth-submit">Create Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Sign in here</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
