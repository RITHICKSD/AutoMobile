<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN | AUTOCORE Tactical</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body class="auth-page">
    <div class="auth-bg"></div>

    <div class="auth-card reveal">
        <div class="auth-header-tools">
            <button id="auth-theme-toggle" class="globe-toggle" title="Toggle Light/Dark Mode">
                <i class="fas fa-moon"></i>
            </button>
            <button id="rtl-toggle" class="globe-toggle" title="Toggle LTR/RTL">
                <span>LTR</span>
            </button>
        </div>
        <div class="auth-brand">
            <div class="logo" style="justify-content: center;">
                <a href="index.html" style="text-decoration: none; color: inherit;"><i class="fas fa-shield-halved"></i> AUTO<span>CORE</span></a>
            </div>
            <p>Mission Command Access</p>
        </div>

        <form class="auth-form" action="dashboard.html">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="commander@autocore.tactical" required>
                </div>
            </div>

            <div class="form-group">
                <label>Access Code</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Enter password" required>
                </div>
            </div>

            <div class="auth-options">
                <label class="remember-me">
                    <input type="checkbox"> <span>Keep session active</span>
                </label>
                <a href="#" class="forgot-pw">Forgot Code?</a>
            </div>

            <button type="submit" class="auth-submit">Initialize Session</button>

            <div class="auth-divider">
                <span>Or Secure Via</span>
            </div>

            <div class="social-auth">
                <a href="#" class="social-btn">
                    <i class="fab fa-google"></i> Google
                </a>
                <a href="#" class="social-btn">
                    <i class="fab fa-apple"></i> Apple ID
                </a>
            </div>
        </form>

        <div class="auth-footer">
            Don't have an uplink? <a href="register.html">Register here</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
